services:
  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?DISCORD_BOT_TOKEN is required}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?DISCORD_GUILD_ID is required}
      API_BASE_URL: ${API_BASE_URL:-https://api.ugaktp.com}
      BOT_API_SECRET: ${BOT_API_SECRET:?BOT_API_SECRET is required}
      SYNC_INTERVAL_MS: ${SYNC_INTERVAL_MS:-30000}
    restart: unless-stopped
